name: Test

on: [push, pull_request]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Run host tests
        run: make -C tests/host
      - name: Run host tests under ASan/UBSan
        run: make -C tests/host asan

  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install Arm GNU toolchain (Cortex-M55 needs GCC >= 14)
        run: |
          curl -sL -o gcc.tar.xz "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz"
          mkdir -p $HOME/gcc-arm && tar -xf gcc.tar.xz -C $HOME/gcc-arm --strip-components=1
      - name: Run QEMU tests
        run: make -C tests/qemu CC=$HOME/gcc-arm/bin/arm-none-eabi-gcc
